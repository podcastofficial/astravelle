<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astravelle Dashboard + Admin Preview</title><style>:root{--bg:#080d0c;--panel:#101816;--line:#26352e;--text:#f1f5f0;--muted:#8d9c92;--gold:#d7ef9b;--green:#91bd74}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit;cursor:pointer}.layout,.admin-layout{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar,.admin-sidebar{padding:25px 17px;border-right:1px solid var(--line);background:#0b110f;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;padding:0 8px 35px;color:var(--text);text-decoration:none}.brand-logo{width:39px;height:39px;border-radius:13px;background:var(--gold);color:#142017;display:grid;place-items:center;font-size:23px;font-weight:900}.brand b{display:block;font-size:12px;letter-spacing:2px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:1.4px;margin-top:5px}.nav-title,.admin-label{font-size:10px;letter-spacing:1.6px;color:var(--muted);padding:0 12px 12px}.nav{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#9caaa1;padding:12px;border-radius:10px;text-align:left;font-size:12px;margin:2px 0;width:100%}.nav span{width:20px;text-align:center;font-size:16px}.nav.selected,.nav:hover{background:#1b2920;color:var(--gold)}.admin-link{margin-top:25px;border:1px solid #394c35;color:var(--gold);border-radius:10px;padding:12px;text-decoration:none;font-size:11px}.sidebar-note{margin-top:auto;border-top:1px solid var(--line);padding:16px 8px 0;font-size:10px;letter-spacing:1px;color:#d6dfd5;line-height:1.8}.sidebar-note small,.admin-side-bottom small{color:var(--muted);letter-spacing:0}.content,.admin-content{padding:29px clamp(16px,3.5vw,48px);width:100%;max-width:1600px;margin:0 auto}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.header small{font-size:9px;color:var(--muted);letter-spacing:1.4px}.header h1{font-size:25px;margin:7px 0 0;letter-spacing:-.6px}.avatar{width:38px;height:38px;border-radius:50%;border:1px solid #405341;background:#1b2920;color:var(--gold);display:grid;place-items:center;font-weight:800}.hero{min-height:265px;border:1px solid #33432e;border-radius:20px;background:radial-gradient(ellipse at 80% 40%,#263c2a,#16231a 35%,#101815 75%);padding:28px;display:flex;align-items:center;justify-content:space-between;overflow:hidden;position:relative}.chip{display:inline-block;border:1px solid #42583b;border-radius:20px;padding:7px 10px;color:var(--gold);font-size:9px;letter-spacing:1.3px}.hero h2{font-size:clamp(32px,4vw,44px);line-height:1.05;letter-spacing:-1.5px;margin:17px 0 10px}.hero em{font-style:normal;color:var(--gold)}.hero p,.panel p{font-size:12px;color:var(--muted);line-height:1.7;max-width:400px}.gold-btn{background:var(--gold);color:#152017;border:0;border-radius:9px;padding:12px 15px;font-size:11px;font-weight:800;margin-top:10px}.orb{width:155px;height:155px;border:1px solid #718d56;border-radius:50%;display:grid;place-items:center;margin-right:5%;box-shadow:0 0 70px #789b4124;flex-shrink:0}.orb b{width:80px;height:80px;border-radius:25px;background:linear-gradient(145deg,#e2f5ac,#91b36b);color:#142016;display:grid;place-items:center;font-size:42px;transform:rotate(-8deg)}.stats,.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:15px 0}.stats article,.metric,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.stats small,.metric small,.panel>small,.panel-title small{display:block;font-size:9px;letter-spacing:1.2px;color:var(--muted)}.stats strong,.metric strong{display:block;font-size:25px;margin:12px 0 5px}.stats span,.metric span{font-size:10px;color:var(--muted)}.columns,.admin-columns{display:grid;grid-template-columns:1.2fr .8fr;gap:13px}.panel h3{font-size:17px;margin:7px 0 12px}.quick{display:flex;align-items:center;gap:12px;width:100%;background:transparent;color:var(--text);border:0;border-top:1px solid #26352e;padding:12px 0;text-align:left}.quick>b{display:grid;place-items:center;width:35px;height:35px;background:#1d2a20;color:var(--gold);border-radius:10px}.quick span{flex:1}.quick strong,.quick small{display:block}.quick strong{font-size:11px}.quick small{font-size:10px;color:var(--muted);margin-top:4px}.quick i{font-style:normal;color:var(--muted)}.bar{height:5px;background:#2b392e;border-radius:9px;margin:25px 0 10px}.bar span{display:block;width:100%;height:100%;background:var(--green);border-radius:9px}.inner{margin-top:8px;min-height:280px;padding:30px}.inner h2{font-size:29px;margin-bottom:10px}.inner p{max-width:600px}.admin-sidebar{padding-top:24px}.admin-brand{padding-bottom:32px}.count{margin-left:auto;font-style:normal;background:#374b31;color:var(--gold);border-radius:12px;padding:3px 7px;font-size:9px}.admin-side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:16px 8px;color:#d6dfd5;font-size:10px;line-height:1.9}.demo-dot{display:inline-block;width:7px;height:7px;background:#e0b96e;border-radius:50%;margin-right:7px}.admin-side-bottom a{display:block;color:var(--gold);text-decoration:none;margin-top:12px}.admin-user{display:flex;align-items:center;gap:10px}.admin-user b,.admin-user small{display:block}.admin-user b{font-size:11px}.admin-user small{font-size:8px;margin-top:4px}.warning{display:flex;gap:10px;background:#292316;border:1px solid #59472a;color:#e8c783;padding:13px 15px;border-radius:10px;font-size:11px;line-height:1.6;margin-bottom:15px}.warning span{color:#d7c7a4}.notice{background:#1c2c20;border:1px solid #42583b;border-radius:9px;color:var(--gold);padding:12px;margin-bottom:14px;font-size:11px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.metric strong{font-size:27px}.admin-columns{grid-template-columns:1.15fr .85fr}.panel-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.text-btn{border:0;background:transparent;color:var(--gold);font-size:10px}.request{display:grid;grid-template-columns:1.2fr auto auto;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.request b,.request small{display:block}.request b{font-size:11px}.request small{font-size:9px;color:var(--muted);margin-top:5px}.request strong{font-size:11px}.pending,.approved,.rejected{display:inline-block;border-radius:20px;padding:5px 8px;font-size:9px;white-space:nowrap}.pending{background:#302819;color:#e9c879}.approved{background:#1c3022;color:#a9e0a3}.rejected{background:#321f20;color:#f0a6a6}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:680px;text-align:left}th{font-size:9px;color:var(--muted);letter-spacing:1px;font-weight:600}td,th{padding:14px 10px;border-bottom:1px solid var(--line);font-size:10px}td{color:#d9e1d9}.row-actions{display:flex;gap:5px}.approve,.reject{border-radius:6px;padding:7px 8px;font-size:9px;border:1px solid}.approve{background:#203522;color:#b5e5a8;border-color:#3b6040}.reject{background:#332022;color:#f2aaaa;border-color:#684044}.search{background:#0b110f;border:1px solid var(--line);color:var(--text);padding:9px 10px;border-radius:8px;font-size:10px;max-width:190px}.muted,.footnote{font-size:10px;color:var(--muted)}.footnote{margin-top:17px;line-height:1.6}footer{display:flex;justify-content:space-between;gap:10px;margin-top:27px;color:#6f8075;font-size:8px;letter-spacing:1px}footer span{text-align:right}@media(max-width:1000px){.layout,.admin-layout{grid-template-columns:1fr}.sidebar,.admin-sidebar{display:block;min-height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px}.brand{padding:0 5px 12px}.nav-title,.admin-label,.sidebar-note,.admin-side-bottom{display:none}.nav{display:inline-flex;width:auto;padding:9px;font-size:10px}.nav span{display:none}.admin-link{display:inline-block;margin:10px 0 0}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.columns,.admin-columns{grid-template-columns:1fr}}@media(max-width:560px){.content,.admin-content{padding:20px 12px}.hero{min-height:280px;padding:20px}.orb{position:absolute;right:-55px;top:25px;opacity:.22}.hero>div:first-child{position:relative;z-index:1}.stats{grid-template-columns:1fr}.stats article{padding:14px}.stats strong{margin:7px 0 2px}.metrics{gap:8px}.metric{padding:13px}.metric strong{font-size:22px}.request{grid-template-columns:1fr auto}.request .pending,.request .approved,.request .rejected{grid-column:2}.header h1{font-size:22px}footer{flex-direction:column}footer span{text-align:left}.admin-user>span:last-child{display:none}}</style></head><body><div id="root"></div><script>
const navUser=['Home','Earn','Referrals','Wallet','Activity','Profile'];const navAdmin=['Overview','Users','Deposits','Withdrawals','Tasks','Gift Codes','Referrals','Settings'];let page='Home',isAdmin=false,notice='',q='';let withdrawals=[{id:'WD-1024',user:'demo_user_01',amount:'25.00 USDT',wallet:'0x1234…89ab',status:'Pending'},{id:'WD-1023',user:'demo_user_02',amount:'10.00 USDT',wallet:'0x7890…12cd',status:'Pending'},{id:'WD-1022',user:'demo_user_03',amount:'8.50 USDT',wallet:'0xabcd…4567',status:'Approved'}];const users=[{id:'10001',name:'demo_user_01',balance:'42.50',status:'Active'},{id:'10002',name:'demo_user_02',balance:'15.00',status:'Active'},{id:'10003',name:'demo_user_03',balance:'0.00',status:'Restricted'}];
function setPage(p){page=p;notice='';render()}function approve(id,status){withdrawals=withdrawals.map(w=>w.id===id?{...w,status}:w);notice=id+': demo status changed to '+status+'. No real payment was sent.';render()}
function render(){const nav=isAdmin?navAdmin:navUser;document.getElementById('root').innerHTML=isAdmin?adminView(nav):userView(nav);document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>approve(b.dataset.id,b.dataset.action)));const search=document.getElementById('search');if(search)search.addEventListener('input',e=>{q=e.target.value;render();const s=document.getElementById('search');if(s){s.focus();s.setSelectionRange(q.length,q.length)}})}
function userView(nav){return `<main class="layout"><aside class="sidebar"><div class="brand"><span class="brand-logo">A</span><span><b>ASTRAVELLE</b><small>USER DASHBOARD</small></span></div><p class="nav-title">MENU</p>${nav.map((s,i)=>`<button class="nav ${page===s?'selected':''}" data-page="${s}"><span>${['⌂','✦','♧','◇','◷','○'][i]}</span>${s}</button>`).join('')}<button class="admin-link" id="goAdmin">⚙ Open Admin Panel ↗</button><div class="sidebar-note">DEMO MODE<br><small>Payments disabled</small></div></aside><section class="content"><header class="header"><div><small>ASTRAVELLE / USER</small><h1>${page}</h1></div><span class="avatar">U</span></header>${page==='Home'?`<section class="hero"><div><span class="chip">✦ MEMBER DASHBOARD</span><h2>Build your next<br><em>milestone.</em></h2><p>Track demo rewards, explore tasks and manage your account.</p><button class="gold-btn" data-page="Earn">Explore earning ↗</button></div><div class="orb"><b>A</b></div></section><div class="stats"><article><small>DEMO BALANCE</small><strong>$0.00</strong><span>USDT · preview only</span></article><article><small>TOTAL EARNED</small><strong>$0.00</strong><span>Demo data</span></article><article><small>COMPLETED TASKS</small><strong>0</strong><span>Sample account</span></article></div><div class="columns"><article class="panel"><small>GET STARTED</small><h3>Quick actions</h3>${[['✦','Explore tasks','Discover sample activities','Earn'],['◇','Open wallet','Review wallet preview','Wallet'],['♧','Invite friends','See referral design','Referrals']].map(x=>`<button class="quick" data-page="${x[3]}"><b>${x[0]}</b><span><strong>${x[1]}</strong><small>${x[2]}</small></span><i>↗</i></button>`).join('')}</article><article class="panel"><small>PLATFORM STATUS</small><h3>Interface preview</h3><p>This is a UI demo. No real rewards or transactions occur here.</p><div class="bar"><span></span></div><small>Preview only · 100%</small></article></div>`:`<article class="panel inner"><span class="chip">ASTRAVELLE PREVIEW</span><h2>${page}</h2><p>${({Earn:'Sample earning tasks and daily rewards will appear here when implemented.',Referrals:'Referral links and commissions are not connected.',Wallet:'Demo wallet only. Deposits and withdrawals are disabled.',Activity:'Transaction and task history placeholder.',Profile:'Profile settings placeholder.'})[page]||''}</p><button class="gold-btn" data-page="Home">← Back to dashboard</button></article>`}<footer>© 2026 ASTRAVELLE <span>DEMO BUILD · NOT A LIVE PAYMENT APP</span></footer></section></main>`}
function adminView(nav){let body='';if(page==='Overview')body=`<div class="metrics">${[['TOTAL USERS','1,284','↗ Demo metrics'],['PENDING DEPOSITS','12','Awaiting review'],['PENDING WITHDRAWALS',withdrawals.filter(w=>w.status==='Pending').length,'Awaiting review'],['REWARDS PAID','$428.50','Demo amount']].map(m=>`<article class="metric"><small>${m[0]}</small><strong>${m[1]}</strong><span>${m[2]}</span></article>`).join('')}</div><div class="admin-columns"><article class="panel"><div class="panel-title"><div><small>REQUIRES ATTENTION</small><h3>Withdrawal requests</h3></div><button class="text-btn" data-page="Withdrawals">View all ↗</button></div>${withdrawals.filter(w=>w.status==='Pending').map(w=>`<div class="request"><div><b>${w.id}</b><small>${w.user} · ${w.wallet}</small></div><strong>${w.amount}</strong><span class="pending">Pending</span></div>`).join('')}</article><article class="panel"><small>QUICK NAVIGATION</small><h3>Manage platform</h3>${nav.slice(1).map(s=>`<button class="quick" data-page="${s}"><b>↗</b><span><strong>${s}</strong><small>Open ${s.toLowerCase()} workspace</small></span><i>→</i></button>`).join('')}</article></div>`;
else if(page==='Withdrawals')body=`<article class="panel"><div class="panel-title"><div><small>MANUAL REVIEW QUEUE</small><h3>Withdrawal requests</h3></div><span class="pending">Demo data</span></div><div class="table-wrap"><table><thead><tr><th>REQUEST</th><th>USER</th><th>AMOUNT</th><th>WALLET</th><th>STATUS</th><th>ACTIONS</th></tr></thead><tbody>${withdrawals.map(w=>`<tr><td>${w.id}</td><td>${w.user}</td><td>${w.amount}</td><td>${w.wallet}</td><td><span class="${w.status==='Pending'?'pending':w.status==='Approved'?'approved':'rejected'}">${w.status}</span></td><td>${w.status==='Pending'?`<div class="row-actions"><button class="approve" data-action="Approved" data-id="${w.id}">Approve</button><button class="reject" data-action="Rejected" data-id="${w.id}">Reject</button></div>`:'<span class="muted">Reviewed</span>'}</td></tr>`).join('')}</tbody></table></div><p class="footnote">Demo buttons only update local preview state. No real payment is sent.</p></article>`;
else if(page==='Users')body=`<article class="panel"><div class="panel-title"><div><small>ACCOUNT DIRECTORY</small><h3>Users</h3></div><input id="search" class="search" placeholder="Search demo users…" value="${q}"></div><div class="table-wrap"><table><thead><tr><th>USER ID</th><th>USERNAME</th><th>DEMO BALANCE</th><th>STATUS</th></tr></thead><tbody>${users.filter(u=>(u.name+u.id).toLowerCase().includes(q.toLowerCase())).map(u=>`<tr><td>${u.id}</td><td>${u.name}</td><td>$${u.balance}</td><td>${u.status}</td></tr>`).join('')}</tbody></table></div></article>`;
else body=`<article class="panel inner"><span class="chip">ADMIN WORKSPACE</span><h2>${page}</h2><p>${({Deposits:'Deposit review interface placeholder. On-chain transaction verification is not connected.',Tasks:'Task management placeholder.', 'Gift Codes':'Gift code creation and redemption history placeholder.',Referrals:'Referral statistics and commission ledger placeholder.',Settings:'Admin settings placeholder. Secure authentication is not implemented.'})[page]||'Management section placeholder.'}</p><p class="muted">No real data is read or changed in this demo.</p></article>`;
return `<main class="admin-layout"><aside class="admin-sidebar"><a class="brand admin-brand" href="#" id="backUser"><span class="brand-logo">A</span><span><b>ASTRAVELLE</b><small>ADMIN CONSOLE</small></span></a><div class="admin-label">MANAGEMENT</div>${nav.map((s,i)=>`<button class="nav ${page===s?'selected':''}" data-page="${s}"><span>${['▦','♙','↓','↑','✦','▣','♧','⚙'][i]}</span>${s}${s==='Withdrawals'?'<i class="count">7</i>':''}</button>`).join('')}<div class="admin-side-bottom"><span class="demo-dot"></span> Demo admin session<br><small>Not authenticated</small><a href="#" id="backUser2">← User dashboard</a></div></aside><section class="admin-content"><header class="header"><div><small>ADMINISTRATION / ${page.toUpperCase()}</small><h1>${page}</h1></div><div class="admin-user"><span class="avatar">A</span><span><b>Admin Preview</b><small>UI DEMO ONLY</small></span></div></header><div class="warning">⚠ <span><b>Demo mode:</b> sample figures only. Approval/rejection buttons change this preview only; no funds or accounts are affected.</span></div>${notice?`<div class="notice">${notice}</div>`:''}${body}<footer>© 2026 ASTRAVELLE <span>ADMIN PREVIEW · SECURE LOGIN NOT IMPLEMENTED</span></footer></section></main>`}
document.addEventListener('click',e=>{if(e.target.closest('#goAdmin')){isAdmin=true;page='Overview';render()}if(e.target.closest('#backUser')||e.target.closest('#backUser2')){e.preventDefault();isAdmin=false;page='Home';render()}});render();
</script></body></html>
